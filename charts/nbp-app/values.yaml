image:
  repository: europe-central2-docker.pkg.dev/nbp-devops-prod/nbp-docker/nbp-app
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: gce

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

probes:
  liveness:
    path: /health/live
  readiness:
    path: /health/ready

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true