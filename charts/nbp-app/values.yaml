image:
  repository: europe-central2-docker.pkg.dev/nbp-devops-prod/nbp-docker/nbp-app
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

management:
  enabled: true
  port: 9090

ingress:
  enabled: false
  className: gce
  redirectToHttps: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

probes:
  port: management
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

tls:
  enabled: false
  hostname: ""
  secretName: nbp-app-tls
  acmeServer: https://acme-staging-v02.api.letsencrypt.org/directory