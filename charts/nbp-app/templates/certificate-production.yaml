{{- if .Values.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-tls-prod
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Release.Name }}-tls-prod
  dnsNames:
    - {{ .Values.tls.hostname | quote }}
  issuerRef:
    name: {{ .Release.Name }}-letsencrypt-prod
    kind: Issuer
{{- end }}